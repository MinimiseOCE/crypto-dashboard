<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cryptos</title>
    <link href="style.css" rel="stylesheet">
</head>
<body>
    <div class="header">
        <div class="search-section">
            <div>
                <img class="header-icon" src="icons/search.svg">
                <input class="search-bar">
            </div>
            <div class="pfp-info">
                <img class="header-icon" src="icons/notification.svg">
                <img class="header-pfp" src="pfp.jpg">
                <p class="pfp-text">Sandor Clegane</p>
            </div>
        </div>
        <div class="btn-section">
            <div>
                <img class="big-pfp" src="pfp.jpg">
                <p>
                    Hi There, <br>
                    <span class="big-text">Sandor Clegane (@theHound)</span>
                </p>
            </div>
            <div>
                <button class="hdr-button">New</button>
                <button class="hdr-button">Upload</button>
                <button class="hdr-button">Share</button>
            </div>
        </div>
    </div>
    <div class="sidebar">
        <div id="title"> <img src="icons/dashboard.svg"> <h1>Dashboard</h1></div>
        <ul class="side-items">
            <li><img src="icons/home.svg" class="side-icons">Home</li>
            <li><img src="icons/account.svg" class="side-icons">Profile</li>
            <li><img src="icons/message.svg" class="side-icons">Message</li>
            <li><img src="icons/history.svg" class="side-icons">History</li>
            <li><img src="icons/wallet.svg" class="side-icons">Wallet</li>
            <li><img src="icons/community.svg" class="side-icons">Communities</li>
        </ul>
        <ul class="side-items">
            <li><img src="icons/settings.svg" class="side-icons">Settings</li>
            <li><img src="icons/support.svg" class="side-icons">Support</li>
            <li><img src="icons/privacy.svg" class="side-icons">Privacy</li>
        </ul>
    </div>
    <div class="main-content"></div>
    
</body>
</html>
